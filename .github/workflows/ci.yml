name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generated grammar is up to date
        run: npm run build && git diff --exit-code syntaxes/
      - name: Manifest matches Orca's schema
        run: npm run validate
      - name: Grammar fixtures
        run: npm test
      - name: Orca limits (timing over perl's own library)
        run: npm run check
